    transform: rotate(7deg);
  }
}
.flap {
  animation: flap 0.45s ease-in-out infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes flap {
  to {
    transform: scaleY(0.35);
  }
}
.hud-card {
  background: linear-gradient(180deg, #fdfbf7, #f9f2e6);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  box-shadow:
    0 5px 0 rgba(74, 64, 104, 0.12),
    inset 0 -2px 0 hsla(38, 48%, 71%, 0.35);
}
.hud-top {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 20;
  pointer-events: none;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.hud-top > * {
  pointer-events: auto;
}
.crest {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 16px 10px 10px;
  min-width: 250px;
}
.crest-title {
  font:
    700 21px/1.05 Fredoka,
    sans-serif;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.crest-sub {
  font:
    600 12.5px Nunito,
    sans-serif;
  color: var(--ink2);
  margin: 2px 0 6px;
}
.res-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 13px 5px 5px;
  border-radius: 999px;
  background: rgba(255, 250, 240, 0.96);

    sans-serif;

  transition: transform 0.12s;
}
button.pill {
  cursor: pointer;
}
button.pill:hover {
  transform: translateY(-1px);
}
.pill .ico {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.pill .ico.lit {
  animation: flicker 1.8s ease-in-out infinite;
}
@keyframes flicker {
  50% {
    transform: scale(1.08) rotate(-4deg);
  }
}
.pill-sub {
  font:
    600 12.5px Nunito,
    sans-serif;
  color: var(--ink3);
}
.xpbar {
  width: 100%;
  background: rgba(160, 120, 60, 0.16);

  box-shadow: 0 1px 0 hsla(0, 0%, 100%, 0.8);
}
.xpbar,
.xpbar-fill {

}
.xpbar-fill {

}
.quests-wrap {
  position: absolute;
  right: 16px;
  top: calc(env(safe-area-inset-top, 0px) + 70px);
  z-index: 19;
  width: 300px;
}
.quests {
  overflow: hidden;
}
.quests-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
}
.q-ico {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: #eddeb2;
  color: #4a4068;
}
.q-title {
  font:
    600 15px Fredoka,
    sans-serif;
  flex: 1;
}
.q-count {

    700 13px Fredoka,

  color: var(--ink2);
  background: var(--paper3);

}
.quests-body {
  padding: 0 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.quest {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 8px 9px;
  border-radius: 13px;
  background: hsla(0, 0%, 100%, 0.65);
  border: 1px solid hsla(39, 53%, 80%, 0.8);
}
.q-check {
  width: 22px;
  height: 22px;
  flex: none;
  border-radius: 7px;
  border: 2px solid var(--line2);
  background: #ffffff;

}
.q-check:hover,

  padding: 0;

}
.q-name {

}

  color: var(--ink3);
}
.q-meta {
  gap: 5px;
  font-size: 12px;
  color: var(--ink3);
  margin-top: 2px;
}
.dock,
.q-meta {

  align-items: center;
}
.dock {

  border-radius: 24px;

}

}
.dock-btn:active {

}
.dock-btn.on {
  background: #f2e4c8;
  color: var(--ink);
  box-shadow: inset 0 -2px 0 rgba(185, 138, 34, 0.35);
}
.dock-ico {
  position: relative;
  display: grid;
  place-items: center;
  height: 24px;
}
.dock-badge {
  position: absolute;
  top: -5px;
  right: -10px;

}
.dock-l {

    600 11.5px Fredoka,
    sans-serif;
}
.dock-sep {

}
.dock-main {

}
.map-ctrl {
  position: absolute;
  left: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);

  flex-direction: column;
  gap: 8px;
}
.map-btn {
  width: 42px;
  height: 42px;
  border-radius: 14px !important;
  background: rgba(255, 250, 240, 0.96) !important;
  border: 1.5px solid var(--line) !important;
  box-shadow: 0 5px 0 rgba(74, 64, 104, 0.12);
  color: var(--ink2) !important;
}
.map-btn.on {
  color: var(--teal) !important;
}
.hint {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  z-index: 18;
  pointer-events: none;

    600 13px Fredoka,
    sans-serif;
  color: #fbf7f0;
  background: rgba(70, 61, 99, 0.42);

  border-radius: 999px;

  white-space: nowrap;
  animation: hintIn 0.6s 0.8s both;
}
@keyframes hintIn {
  0% {
    opacity: 0;
    transform: translate(-50%, 8px);
  }
  to {
    opacity: 1;
    transform: translate(-50%);
  }
}
.banner {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  z-index: 21;
  font:
    600 12.5px Fredoka,
    sans-serif;
  background: #f7f0de;
  color: #3e3557;

  border-radius: 999px;
  padding: 5px 14px;
  white-space: nowrap;
}
.banner.bad {
  background: #f8e5e1;

  border-color: #e3ada2;
  top: calc(env(safe-area-inset-top, 0px) + 116px);
}
.toasts {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 18px);

  flex-direction: column;
  pointer-events: none;
  width: min(460px, calc(100vw - 32px));
}
.toast,
.toasts {
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast {
  font:
    600 14px Fredoka,
    sans-serif;
  color: var(--ink);
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 9px 16px;
  box-shadow: 0 5px 0 rgba(74, 64, 104, 0.12);
  animation: toastIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
  text-align: center;
}
.toast.gold {
  background: linear-gradient(180deg, #f6eed8, #ecdcb0);
  border-color: #dfc277;
  color: #352e4b;
}
.toast.bad {
  background: #f8e5e1;
  border-color: #e3ada2;
  color: #5d5183;
}
@keyframes toastIn {
  0% {
    opacity: 0;
    transform: translateY(-10px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.gbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  font:
    600 14px Fredoka,
    sans-serif;
  color: var(--ink);
  background: #f8f1e3;
  border: 1.5px solid #ddc7a0;
  border-radius: 14px;
  padding: 8px 13px;
  box-shadow: 0 3px 0 #d3bb92;
  transition:

    box-shadow 0.08s,

    filter 0.15s;
  cursor: pointer;
}
.gbtn:hover {
  background: #fbf7ee;
}
.gbtn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #d3bb92;
}
.gbtn.sm {
  font-size: 13px;
  padding: 5px 10px;
  border-radius: 11px;
}
.gbtn.primary {
  background: var(--terra);
  border-color: #ba6445;
  color: #ffffff;
  box-shadow: 0 3px 0 var(--terraD);
}
.gbtn.primary:hover {
  filter: brightness(1.05);
}
.gbtn.teal {
  background: var(--teal);
  border-color: #4b4169;
  color: #ffffff;
  box-shadow: 0 3px 0 var(--tealD);
}
.gbtn.teal:hover {
  filter: brightness(1.06);
}
.gbtn.gold {
  background: var(--gold);
  border-color: #caa043;
  color: #1d1929;
  box-shadow: 0 3px 0 var(--goldD);
}
.gbtn.gold:hover {
  filter: brightness(1.05);
}
.gbtn.danger {
  background: #f8e5e1;
  border-color: #e3ada2;
  color: #5d5183;
  box-shadow: 0 3px 0 #da9d91;
}
.gbtn.ghost {
  background: transparent;
  border-color: transparent;

}
.gbtn.ghost:hover {

}
.gbtn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
  filter: none;
}
.chip:focus-visible,
.dock-btn:focus-visible,
.gbtn:focus-visible,
.icon-btn:focus-visible,
.pill:focus-visible {
  outline: 3px solid rgba(42, 157, 143, 0.55);
  outline-offset: 2px;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  border-radius: 11px;
  border: 0;
  background: transparent;
  color: var(--ink3);
  cursor: pointer;
  transition:
    background 0.15s,
    color 0.15s;
}
.icon-btn:hover {
  background: rgba(160, 120, 60, 0.12);
  color: var(--ink);
}
.row-del:hover {
  color: #b54236;
  background: #f8e5e1;
}
.mini-btn {
  font:
    600 12px Fredoka,
    sans-serif;
  padding: 3px 9px;
  border-radius: 9px;
  background: #e7f3f0;
  color: var(--tealD);
  border: 1px solid #c2dfd9;
  cursor: pointer;
  flex: none;
}
.mini-btn:hover {
  background: #d7ece8;
}
.drawer {
  position: fixed;
  z-index: 40;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (min-width: 768px) {
  .drawer {
    top: calc(env(safe-area-inset-top, 0px) + 84px);
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    width: min(440px, calc(100vw - 32px));
  }
  .drawer.wide {
    width: min(880px, calc(100vw - 32px));
  }
  .drawer-in {
    animation: drawerInR 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  .quests-wrap.hidden-when-drawer {
    display: none;
  }
}
@media (max-width: 767px) {
  .drawer {
    left: 8px;
    right: 8px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    max-height: min(74vh, calc(100% - 150px));
  }
  .drawer-in {
    animation: drawerInB 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  .quests-wrap.hidden-when-drawer {
    display: none;
  }
}
@keyframes drawerInR {
  0% {
    opacity: 0;
    transform: translateX(28px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes drawerInB {
  0% {
    opacity: 0;
    transform: translateY(28px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.drawer-head {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 12px 13px 14px;
  border-bottom: 1.5px solid var(--line);
}
.drawer-icon {
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 12px;
  display: grid;

}
.lv-badge {
  font:
    700 17px Fredoka,
    sans-serif;
  color: #ffffff;
}
.drawer-title {
  font:
    700 18.5px/1.15 Fredoka,
    sans-serif;
  color: var(--ink);
  text-wrap: balance;
}
.drawer-sub {
  font-size: 13px;
  color: var(--ink2);
  margin-top: 1px;
}
.drawer-body {
  padding: 14px;
  flex: 1;
  min-height: 0;
}
.scroll-y {
  overflow-y: auto;
  overscroll-behavior: contain;
}
.scroll-y::-webkit-scrollbar {
  width: 10px;
}
.scroll-y::-webkit-scrollbar-thumb {
  background: #dfceac;
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: padding-box;
}
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(20, 45, 50, 0.4);

@keyframes fadeIn {

}

}
@keyframes popIn {
  0% {

.lbl {

/* ---- city additions ---- */
.cs-label { font: 700 9.5px Fredoka, sans-serif; fill: #282238; letter-spacing: 0.02em; }
.isle-name { font: 600 10.5px Fredoka, sans-serif; fill: #fbf7f0; letter-spacing: 0.14em; }
.plot { cursor: pointer; outline: none; }
.plot:hover > g, .plot:focus-visible > g { filter: brightness(1.06) drop-shadow(0 0 6px rgba(255, 240, 200, 0.8)); }
.agent { cursor: pointer; }
.agent .ag-legs { animation: agStep 0.42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
.agent.still .ag-legs { animation: none; }
.agent .ag-tail { animation: sway 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: right bottom; }
@keyframes agStep { from { transform: scaleY(0.82) skewX(-8deg); } to { transform: scaleY(1) skewX(8deg); } }

/* ---- building interiors ---- */
.interior { position: fixed; inset: 0; z-index: 26; animation: enterIn 0.55s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
@keyframes enterIn { 0% { opacity: 0; transform: scale(0.12); filter: blur(6px); } 55% { opacity: 1; filter: none; } to { opacity: 1; transform: none; } }
.interior-bg { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--tint) 16%, #f8e9df) 0%, color-mix(in srgb, var(--tint) 10%, #eddbe4) 100%); }
.interior-bg::after { content: ""; position: absolute; left: 12%; right: 38%; top: 18%; bottom: 8%; border-radius: 50%; background: rgba(255, 250, 244, 0.5); }
.interior-top { position: absolute; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); z-index: 2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.interior-title { display: flex; align-items: center; gap: 8px; font: 700 20px Fredoka, sans-serif; color: var(--ink); text-shadow: none; }
.interior-title small { font: 600 14px Nunito, sans-serif; color: var(--ink2); }
.interior-dot { width: 12px; height: 12px; border-radius: 4px; box-shadow: 0 0 0 2px rgba(255, 248, 236, 0.8); }
.interior-stage { position: absolute; left: 16px; right: 480px; top: 70px; bottom: 100px; }
.room { width: 100%; height: 100%; overflow: visible; }
.pin-btn { position: absolute; z-index: 2; left: 50%; transform: translateX(calc(-50% - 232px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); }
.note { cursor: pointer; outline: none; transition: filter 0.15s; }
.note:hover, .note:focus-visible { filter: brightness(1.05); }
.note-t { font: 700 5.2px Nunito, sans-serif; fill: #252034; }
.note-empty { font: 700 9px Fredoka, sans-serif; fill: #50456f; }
.plaque-t { font: 700 9px Fredoka, sans-serif; fill: #ffffff; }
.crew-t { font: 700 6.5px Fredoka, sans-serif; fill: #2b253c; }
.shaft { mix-blend-mode: screen; animation: glowp 6s ease-in-out infinite; }
@media (max-width: 767px) {
  .interior-stage { left: 4px; right: 4px; top: calc(env(safe-area-inset-top, 0px) + 58px); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px + 46vh); height: auto; }
  .interior ~ .drawer { max-height: 46vh; }
  .interior-title { font-size: 16px; }
  .pin-btn { display: none; }
}

/* ---- goal tree ---- */
.gt-hint { font-size: 12.5px; color: var(--ink2); margin: -2px 0 10px; line-height: 1.45; }
.gt-field { padding: 10px; border-radius: 16px; background: color-mix(in srgb, var(--fc) 8%, #fefcf9); border: 1.5px solid color-mix(in srgb, var(--fc) 30%, #ece0cb); display: flex; flex-direction: column; gap: 7px; }
.gt-head { display: flex; align-items: center; gap: 7px; font: 600 14px Fredoka, sans-serif; }
.gt-name { flex: 1; min-width: 0; }
.gt-tier { font: 700 11px Fredoka, sans-serif; color: #ffffff; background: var(--fc); padding: 1px 8px; border-radius: 999px; }
.gt-slots { font: 700 11.5px Fredoka, sans-serif; color: var(--ink2); background: var(--paper3); padding: 1px 8px; border-radius: 999px; }
.gt-lock, .gt-open { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--ink3); padding: 8px 10px; border-radius: 12px; border: 1.5px dashed var(--line2); background: rgba(255, 255, 255, 0.5); }
.gt-open { color: var(--tealD); border-color: #a3d1c8; }
.gt-done { display: flex; flex-wrap: wrap; gap: 5px; }
.gt-chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; font: 700 11.5px Nunito, sans-serif; color: #42395e; background: #e4f2e0; border: 1px solid #bbdcb5; border-radius: 8px; padding: 2px 4px 2px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-chip button { border: 0; background: none; color: #6d8c69; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; }
.gt-add { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr) auto; gap: 8px; }
.gt-full { font-size: 12.5px; color: #5d5183; margin-top: 6px; }
@media (max-width: 480px) { .gt-add { grid-template-columns: 1fr auto; } .gt-add select { grid-column: 1 / -1; } }

/* ---- canvas world ---- */
.world-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.light-ico { width: 18px; height: 18px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 2px currentColor; }
.light-ico[data-mode="auto"] { background: linear-gradient(135deg, #dbb865 50%, #544977 50%); }
.light-ico[data-mode="day"] { background: #dbb865; box-shadow: 0 0 0 3px rgba(242, 193, 78, 0.35); }
.light-ico[data-mode="golden"] { background: linear-gradient(180deg, #e3b487, #cf7858); }

  /* ===================== assets: vehicles, people, animals, props ===================== */

  /* draw a vehicle centred on the pen origin.
     Parts are drawn back-to-front: side-by-side parts (a van's box and

  function drawVehicle(pn, kind, color, yaw, wheelPhase = 0) {
    const V = VEHICLES[kind] || VEHICLES.hatch, L = V.L, Wd = V.W, hl = L / 2, hw = Wd / 2;
    const W = orient(yaw);
    const leftNear = W(0, 1)[0] + W(0, 1)[1] > 0;

        kid(-hl * 0.5, wall(-hl + 0.5, -1.4, hw - 1.2, hw - 0.4)),
        kid(-hl * 0.5, wall(-hl + 0.5, -1.4, -hw + 0.4, -hw + 1.2)),

        [kid(hl - 3, P3(rect(hl - 4.6, hl - 1.2, -hw + 0.5, hw - 0.5), 7.2, rect(hl - 4.6, hl - 4.2, -hw + 0.9, hw - 0.9), 13.2, GLASS, shade(color, 0.14)))]);
    } else if (kind === "bus") {

      part(hl - 3.5, P3(cham(hl - 7, hl, -hw, hw, 1.2), 2.2, cham(hl - 7, hl - 1.5, -hw + 0.3, hw - 0.3, 1), 12.5, color, shade(color, 0.14), (fs) => { fs.forEach((f) => { if (f.na * fr[0] + f.nb * fr[1] > 0.6) decal(pn, f.q, 0.12, 0.88, 0.55, 0.9, GLASS); else if (Math.abs(f.na * fr[0] + f.nb * fr[1]) < 0.3) decal(pn, f.q, 0.1, 0.5, 0.55, 0.9, GLASS); }); lights(fs); }));

  /* ---- boats ---- */

    const W = orient(yaw);

  /* ---- people: simple geometric figures with a bit of personality ---- */
  const SKINS = ["#F3D2B6", "#E8BE98", "#CF9A74", "#A9745A", "#83573F", "#654030"];
  const HAIRS = ["#3A2A26", "#5A3A2C", "#2A2530", "#9A6A3A", "#E2B870", "#7A5A4A", "#C8C0C8"];
  const COATS = ["#E4726A", "#F2A65A", "#5FA8A0", "#6C8FC8", "#9C7CC8", "#F2C45A", "#E88AA8", "#7FB07A", "#F4EDE2", "#4E5A7A", "#D95F5F"];
  const HATS = ["#E4726A", "#F2C45A", "#6C8FC8", "#4E5A7A", "#F4EDE2", "#7FB07A"];
  const TRAITS = ["wave", "phone", "sip", "stretch", "look", "hum"];
  /* crew roles get a signature outfit, prop and working animation (faceless, so the

  const ROLES = {
    script: { build: "tall", hat: { kind: "beret", c: "#3E9B6B" }, style: "bun", bubble: "✎" },
    imagegen: { build: "slim", hat: { kind: "bucket", c: "#F2A7C8" }, style: "curly", bubble: "✦", scarf: "#F0C06A" },
    voice: { build: "round", hat: { kind: "phones", c: "#7E6BC4" }, style: "short", bubble: "♪" },
    editor: { build: "slim", hat: { kind: "visor", c: "#E0A526" }, style: "long", bubble: "✂" },
    thumb: { build: "kid", hat: { kind: "cap", c: "#1F8FA3" }, style: "short", bubble: "★" },
    publish: { build: "tall", hat: { kind: "phones", c: "#D9734E" }, style: "bald", bubble: "▶", scarf: "#FFF6EC" },
  };
  const ROLE_BUBBLE = Object.fromEntries(Object.entries(ROLES).map(([k, v]) => [k, v.bubble]));
  function roleOf(wk) {
    if (ROLES[wk.id]) return wk.id;
    const n = (wk.name || "").toLowerCase();
    return /script|writ|copy/.test(n) ? "script" : /image|art|design|illustr/.test(n) ? "imagegen" : /voice|audio|podcast|narrat/.test(n) ? "voice"
      : /edit|video|cut/.test(n) ? "editor" : /thumb|graphic/.test(n) ? "thumb" : /publish|social|market|post/.test(n) ? "publish" : null;
  }
  function dressRole(look, role) {
    const R = ROLES[role]; if (!R) return look;
    look.role = role; look.build = R.build; look.h = R.build === "kid" ? 0.84 : R.build === "tall" ? 1.12 : 1.02;
    look.hat = R.hat; look.style = R.style; look.scarf = R.scarf || null; look.acc = null;
    return look;
  }
  // builders on a construction site: hi-vis vest and a hard hat
  function builderLook(r) {
    const l = randomLook(r);
    l.top = r() < 0.5 ? "#F08A4B" : "#F2C14E"; l.hat = { kind: "hardhat", c: r() < 0.7 ? "#F2C14E" : "#FFF6EC" }; l.acc = null; l.scarf = null; l.build = r() < 0.5 ? "round" : "slim";
    return l;
  }
  function randomLook(r) {
    const pick = (a) => a[(r() * a.length) | 0];
    const build = pick(["slim", "slim", "round", "tall", "kid"]);
    return {
      skin: pick(SKINS), hair: pick(HAIRS), style: pick(["short", "long", "bun", "curly", "bald"]), top: pick(COATS),
      build, h: build === "kid" ? 0.74 : build === "tall" ? 1.14 : 0.95 + r() * 0.1,
      hat: r() < 0.45 ? { kind: pick(["beanie", "cap", "sun", "bowler"]), c: pick(HATS) } : null,
      acc: r() < 0.5 ? pick(["bag", "phone", "coffee", "umbrella", "balloon"]) : null, accC: pick(HATS),

  /* person at screen point (x,y) (feet). dir: +1 facing screen-right, -1 left.

  function drawPerson(ctx, x, y, look, dir, front, phase, moving, scale = 1, act = null, t = 0) {

    const sw = moving ? Math.sin(phase) : 0;
    const bob = moving ? Math.abs(Math.cos(phase)) * 0.7 : 0;
    const wid = look.build === "round" ? 3.4 : look.build === "tall" ? 2.5 : 2.8;
    const bodyH = look.build === "tall" ? 9.5 : 8;

      if (role === "thumb") return [side * (wid * 0.7 + 0.8), armY - 7 + Math.sin(t * 2) * 0.4];
      if (role && side === 1) {
        if (role === "voice") return [wid * 0.45 + 0.8, top - 1.4 + Math.sin(t * 5) * 0.4];
        if (role === "publish") return [wid * 0.6 + 1, top - 0.8];

        else if (look.acc === "coffee" || act0 === "sip") { ctx.fillStyle = "#F4EDE2"; ctx.fillRect(hx - 0.8, hy - 2.2, 1.8, 2.2); ctx.fillStyle = "#9A6A3A"; ctx.fillRect(hx - 0.8, hy - 1.4, 1.8, 0.7); }
